name: swiftdrop
description: DooRush - Food Delivery & Logistics Platform
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  crypto: ^3.0.3
  dio: ^5.7.0
  pay_with_paystack: ^1.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^4.0.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  flutter_secure_storage: ^11.2.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.13.1
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
